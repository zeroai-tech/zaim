name: Build and verify desktop releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zaim-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: --win --x64
            executable: release/win-unpacked/Zaim.exe
          - os: ubuntu-22.04
            platform: linux
            target: --linux --x64
            executable: release/linux-unpacked/zaim
          - os: macos-15-intel
            platform: mac-x64
            target: --mac --x64
            executable: release/mac/Zaim.app/Contents/MacOS/Zaim
          - os: macos-15
            platform: mac-arm64
            target: --mac --arm64
            executable: release/mac-arm64/Zaim.app/Contents/MacOS/Zaim
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Assign release version
        id: version
        run: node scripts/version-build.cjs
      - run: npm run test:updates
      - run: npm run lint
      - run: npm run test:offline
      - run: npm run build
      - run: node electron/stage.cjs
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Rebuild SQLite for Electron
        run: npx electron-builder install-app-deps
      - name: Verify production offline workflow
        run: node scripts/verify-desktop.cjs
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Generate update manifests
        run: node scripts/update-manifest.cjs
      - name: Verify packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-packaged.cjs
        env:
          ZAIM_PACKAGED_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Verify packaged app (Windows/macOS)
        if: runner.os != 'Linux'
        run: node scripts/verify-packaged.cjs
        env:
          ZAIM_PACKAGED_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: zaim-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.zip
            release/*.blockmap
            release/latest.yml
            release/latest-linux.yml
            release/update-mac-*.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}
          path: output/*.png
          retention-days: 7
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zaim-*
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Zaim ${{ needs.build.outputs.version }}
          draft: true
          make_latest: false
          files: installers/*
          fail_on_unmatched_files: true
          body: |
            Background update checks and in-app download/restart are included. Update payloads are checksum verified; changed blocks are reused when available.
            Built from the linked source commit. Offline storage, production mailbox workflow with fake IMAP/SMTP, and packaged-app restart tests passed on Windows, Linux and both Mac architectures.
            Installers are unsigned. First-time sign-in and sending require a network connection. Downloaded mail and local drafts work offline; drafts never send automatically.
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }} -F draft=false -f make_latest=true
